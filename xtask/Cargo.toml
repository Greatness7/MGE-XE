[package]
name = "xtask"
# Inherited, not because xtask is shipped, but so `dist` can name its archive
# from `env!("CARGO_PKG_VERSION")` without parsing another crate's manifest.
version.workspace = true
edition = "2024"
publish = false

[dependencies]
cc = "1"
serde_json = "1"

[[bin]]
name = "xtask"
path = "src/main.rs"

[lints]
workspace = true
