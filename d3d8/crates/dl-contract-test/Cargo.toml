cargo-features = ["per-package-target"]

[package]
name = "dl-contract-test"
version = "0.1.0"
edition = "2024"
publish = false
# 32-bit only; see the note in d3d8/crates/config-contract-test/Cargo.toml.
forced-target = "i686-pc-windows-msvc"

[[bin]]
name = "dl-contract-test"
path = "src/main.rs"

[dependencies]
distantland_foundation = { path = "../../../distantland/crates/foundation" }

[build-dependencies]
cc = "1"
