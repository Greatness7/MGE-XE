far = "Far"
far_tip = "Sets the far tier's end distance in exterior cells and minimum model size in game units."
very_far = "Very far"
very_far_tip = "Sets the very-far tier's end distance in exterior cells and minimum model size in game units."

[distant.fog]
title = "Fog"
start = "Start"
end = "End"
above_water = "Above Water Fog"
above_water_tip = "Sets where clear-weather fog starts and ends above water, in exterior cells."
below_water = "Below Water Fog"
below_water_tip = "Sets where underwater fog starts and ends, in exterior cells. A negative start begins behind the viewpoint."
interiors = "Distant Interiors Fog"
interiors_tip = "Sets fog start and end distances for generated distant interiors, in cells. Requires manual distances and distant statics."
