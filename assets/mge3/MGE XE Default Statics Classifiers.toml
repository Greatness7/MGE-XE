# MGE XE default distant-land overrides
#
# This file is enabled by default for new generation jobs. It uses the same
# [tools.mge-xe.distantland] schema as mod-provided `-metadata.toml` files, but
# is a global override source rather than metadata associated with one plugin.
# Later files in the configured override list replace earlier scalar values;
# metadata shipped beside active plugins is applied after this file.
#
# IDs and mesh paths are case-insensitive. Mesh paths are relative to the
# virtual `Meshes` directory; either slash style and optional `Meshes` or
# `Data Files` prefixes are normalized by the generator.

[tools.mge-xe.distantland]
# Object IDs excluded from distant statics. The chargen objects are temporary
# scene pieces; the Firemoth boats are controlled dynamically below.
exclude_objects = [
    "chargen boat",
    "chargen_cabindoor",
    "chargen_ship_trapdoor",
    "chargen_lantern_03_sway",
    "chargen_plank",
    "fm_boat_dock",
    "fm_boat_island",
]

# Other global filters supported by this table include:
# include_objects = ["object_id"]
# include_interiors = ["Interior Cell Name"]
# exclude_interiors = ["Interior Cell Name"]

# Dynamic visibility groups associate a reference's script or unique object ID
# with a runtime condition. Journal/global ranges use inclusive [low, high]
# endpoints; multiple ranges are ORed, with at most eight ranges per group.

# Morrowind main quest and Great House strongholds
dynamic_visibility = [
    { kind = "journal", script = "GhostfenceScript", journal = "C3_DestroyDagoth", ranges = [[0, 20]] },
    { kind = "global", script = "Strong1", global = "Stronghold", ranges = [[1, 10]] },
    { kind = "global", script = "Strong1_Complete", global = "Stronghold", ranges = [[2, 10]] },
    { kind = "global", script = "Strong1_Construct", global = "Stronghold", ranges = [[1, 1]] },
    { kind = "global", script = "Strong1_Only", global = "Stronghold", ranges = [[2, 2]] },
    { kind = "global", script = "Strong2", global = "Stronghold", ranges = [[3, 10]] },
    { kind = "global", script = "Strong2_Complete", global = "Stronghold", ranges = [[4, 10]] },
    { kind = "global", script = "Strong2_Construct", global = "Stronghold", ranges = [[3, 3]] },
    { kind = "global", script = "Strong2_Not", global = "Stronghold", ranges = [[0, 3]] },
    { kind = "global", script = "Strong2_Only", global = "Stronghold", ranges = [[4, 4]] },
    { kind = "global", script = "Strong3", global = "Stronghold", ranges = [[5, 10]] },
    { kind = "global", script = "Strong3_Complete", global = "Stronghold", ranges = [[6, 10]] },
    { kind = "global", script = "Strong3_Construct", global = "Stronghold", ranges = [[5, 5]] },
    { kind = "global", script = "Strong3_Not", global = "Stronghold", ranges = [[0, 5]] },
    { kind = "global", script = "Strong3_Only", global = "Stronghold", ranges = [[4, 4]] },
    { kind = "global", script = "StrongZero", global = "Stronghold", ranges = [[0, 0]] },

    # Unique-object groups use `object` as the controlling reference. Any
    # `linked_objects` share its enabled state; the list may be omitted.
    { kind = "unique_object", object = "ex_de_scaffold_01_Boe", linked_objects = ["ex_de_scaffold_02_boe", "ex_de_scaffold_03_boe", "ex_de_scaffold_01a_boe", "ex_de_scaffold_02a_Boe", "ex_de_scaffold_02b_Boe", "ex_de_scaffold_02c_Boe", "ex_de_scaffold_03a_Boe",] },
    { kind = "unique_object", object = "Ex_DAE_Boethiah_fixed", linked_objects = ["Ex_DAE_r_platform_01_boe"] },
    { kind = "unique_object", object = "terrain_rock_wg_UNIQUE" },

    # Siege at Firemoth
    { kind = "unique_object", object = "fm_boat_dock" },
    { kind = "unique_object", object = "fm_boat_island" },

