weather_settings_tip = "Edits wind, fog-range, and fog-offset factors for every weather type, and the constant wind for interiors."

[distant.weather]
title = "Distant Land Weather Settings"
wind_factor = "Wind speed factor"
wind_factor_tip = "The wind factor affects how fast grass moves in each weather due to wind speed."
interior_tip = "Constant wind for grass in interior cells, which have no weather. Fog factors do not apply indoors. Interiors flagged to behave like exteriors follow the weather rows instead."
fog_range_factor = "Fog range factor"
fog_range_factor_tip = "Here you can set fog factor for each Morrowind weather type. It is multiplied by the standard above water fog distance to get the fog for each weather. Allowed value range is from 0.001 to 2.0."
fog_offset = "Fog offset"
fog_offset_tip = "Here you can set percent of fog depth that will be moved behind the player for each weather type. Setting fog offset higher will move fog closer towards and then past the player. This effect may be used to emulate additional mist or haze for some weather types. Allowed offset range is 0% - 200%."
reset_tip = "Resets all weather settings to their default value."
save_tip = "Saves all weather settings and closes the window."
cancel_tip = "Closes the window without saving changed settings."

